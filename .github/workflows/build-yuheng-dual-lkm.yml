name: Build Yuheng dual-signature LKM

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build kernelsu.ko (android16-6.12)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --privileged

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build dual-signature kernelsu.ko
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd kernel

          CONFIG_KSU=m CC=clang make \
            KSU_GIT_VERSION=2680 \
            KSU_VERSION=32680 \
            KSU_EXPECTED_SIZE=0x0339 \
            KSU_EXPECTED_HASH=bad08be1f8e813067892adca0e70452cd645ba31e5ed15bec35e60fa430f2f48 \
            KSU_EXPECTED_SIZE2=0x037c \
            KSU_EXPECTED_HASH2=35fd4e58e9401af81397dae9ae5c385f1ef54c72256e3a3014e631cfa6a918e9 \
            KSU_PACKAGE_NAME=me.weishu.kernelsu

          OUT="$GITHUB_WORKSPACE/kernelsu-android16-6.12-yuheng-dual.ko"
          test -s kernelsu.ko
          cp kernelsu.ko "$OUT"
          llvm-strip -d "$OUT" || true
          sha256sum "$OUT" | tee "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          ls -lh "$OUT"

      - name: Upload LKM artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-android16-6.12-yuheng-dual
          path: |
            kernelsu-android16-6.12-yuheng-dual.ko
            SHA256SUMS.txt
          if-no-files-found: error
