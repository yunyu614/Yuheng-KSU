name: Yuheng Android build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuheng-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager-debug:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # On pull_request, github.sha is the merge ref so CI validates the proposed change.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Locate Android SDK tools
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android build components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and build debug APK
        working-directory: manager
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug -PKSU_NAME="玉衡预览" -PKSU_PACKAGE_NAME="me.weishu.kernelsu.preview"
      - name: Run Android Lint (tracked separately)
        working-directory: manager
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug -PKSU_NAME="玉衡预览" -PKSU_PACKAGE_NAME="me.weishu.kernelsu.preview"
      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuheng-preview-lint-report
          path: manager/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yuheng-preview-debug-apk
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
