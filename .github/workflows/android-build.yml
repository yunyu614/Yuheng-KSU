name: Yuheng Android build

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuheng-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: manager
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug -PKSU_NAME="玉衡"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yuheng-debug-apk
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
